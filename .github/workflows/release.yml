name: Redot editor (no SSE4.2)
on:
  push:
    branches: [nosse42]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Make sure SSE4 isn't still forced
        run: |
          if grep -rn "msse4" SConstruct platform/linuxbsd; then
            echo "SSE4 flag still present"; exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev
          pip install scons

      - name: Build editor
        run: scons platform=linuxbsd target=editor arch=x86_64 wayland=no debug_symbols=no -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: redot-editor-nosse42
          path: bin/redot.linuxbsd.editor.x86_64
